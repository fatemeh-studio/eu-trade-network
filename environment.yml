name: eu-trade-network
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - scipy
  - networkx
  - python-louvain
  - duckdb
  - plotly
  - matplotlib
  # Static PNG export for plotly. Pinned to v0: kaleido >= 1 drives a system Chrome
  # (`plotly_get_chrome`), which needs libnss3/libnspr4/libasound2t64 — not present on
  # a stock Ubuntu WSL image. v0 bundles its own headless Chromium and just works.
  - python-kaleido<1
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - pyvis
      - ruff
      - basedpyright
      - nbstripout
      - pre-commit
      - pytest
      - python-dotenv
# NOTE: Quarto is a separate CLI. Install once from https://quarto.org/docs/get-started/
#       (or `conda install -c conda-forge quarto`). It is not a Python package.
